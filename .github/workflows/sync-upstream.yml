name: Sync upstream

# 定时同步上游 guillaumemeyer/watermarks-remover 的变动到本 fork。
# 用 GitHub 官方 merge-upstream 接口（等同网页上的 Sync fork 按钮）：
# 合并发生在 GitHub 服务端，不经过 git push，因此不受
# 「GITHUB_TOKEN 不得推送 workflow 文件改动」的平台限制
# （2026-08-27 那次失败的根因——上游改了自家 release-images.yml，push 被拒）。
# 若某天服务端接口也拒绝，任务会响亮地失败，届时改用带 workflow 权限的 PAT。
# 冲突（HTTP 409）时任务失败并自动开 issue 提醒手动处理。

on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时检查一次
  workflow_dispatch: {}       # 也可在 Actions 页面手动触发

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork via merge-upstream API
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          RESP=$(gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main 2>&1)
          CODE=$?
          echo "$RESP"
          if [ "$CODE" -eq 0 ]; then
            echo "同步完成，方式：$(echo "$RESP" | jq -r '.merge_type // "unknown"')"
            exit 0
          fi
          if echo "$RESP" | grep -q "HTTP 409"; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
          exit 1

      - name: Open issue on merge conflict
        if: failure() && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list -R "${{ github.repository }}" --state open --search "上游同步冲突 in:title" --json number --jq length)
          if [ "$COUNT" = "0" ]; then
            printf '自动同步 guillaumemeyer/watermarks-remover 时发生合并冲突，需要手动处理：\n\n```bash\ncd ~/watermarks-remover\ngit fetch upstream\ngit merge upstream/main   # 解决冲突后 git push origin main\n```\n' > body.md
            gh issue create -R "${{ github.repository }}" --title "上游同步冲突：需要手动合并" --body-file body.md
          fi
