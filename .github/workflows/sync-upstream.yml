name: Sync upstream

# 定时同步上游 guillaumemeyer/watermarks-remover 的变动到本 fork。
# 平台硬限制（实测两次验证）：Actions 内置令牌既不能 push workflow 文件改动，
# 也不能通过 merge-upstream 服务端接口带入 workflow 文件改动。
# 因此策略为：git 合并上游全部内容，但 .github/workflows/ 一律保持本 fork
# 版本不动（上游 CI 对 fork 本无用处，其余代码照常同步）。
# 其他文件的合并冲突：任务失败并自动开 issue 提醒手动处理。

on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时检查一次
  workflow_dispatch: {}       # 也可在 Actions 页面手动触发

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream/main (workflows excluded)
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/guillaumemeyer/watermarks-remover.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "已是最新，无需同步。"
            exit 0
          fi
          set +e
          git merge --no-commit --no-ff upstream/main
          MERGE_RC=$?
          set -e
          if [ $MERGE_RC -ne 0 ]; then
            # workflow 目录内的冲突一律取本 fork 版本；其余冲突走人工
            git checkout --ours -- .github/workflows 2>/dev/null || true
            git add -A -- .github/workflows 2>/dev/null || true
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              git merge --abort || true
              exit 1
            fi
          fi
          # 无论上游怎么改 workflow，都还原成本 fork 的版本（改动的还原、新增的剔除）
          git restore --source=HEAD --staged --worktree -- .github/workflows 2>/dev/null || true
          ADDED=$(git diff --cached --name-only --diff-filter=A -- .github/workflows)
          if [ -n "$ADDED" ]; then
            echo "$ADDED" | while read -r f; do git rm -q -f --cached -- "$f"; rm -f -- "$f"; done
            echo "已剔除上游新增的 workflow 文件：$ADDED"
          fi
          git commit --no-edit
          git push origin main
          echo "上游有新变动，已同步（workflow 文件保持本 fork 版本）。"

      - name: Open issue on merge conflict
        if: failure() && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list -R "${{ github.repository }}" --state open --search "上游同步冲突 in:title" --json number --jq length)
          if [ "$COUNT" = "0" ]; then
            printf '自动同步 guillaumemeyer/watermarks-remover 时发生合并冲突，需要手动处理：\n\n```bash\ncd ~/watermarks-remover\ngit fetch upstream\ngit merge upstream/main   # 解决冲突后 git push origin main\n```\n' > body.md
            gh issue create -R "${{ github.repository }}" --title "上游同步冲突：需要手动合并" --body-file body.md
          fi
