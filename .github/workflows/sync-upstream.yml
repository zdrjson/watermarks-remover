name: Sync upstream

# 定时同步上游 guillaumemeyer/watermarks-remover 的变动到本 fork。
# 策略：merge（不是 reset），保证 fork 自己的提交（如 gui/）永远不丢。
# 冲突时任务失败并自动开 issue 提醒手动处理。

on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时检查一次
  workflow_dispatch: {}       # 也可在 Actions 页面手动触发

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream/main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/guillaumemeyer/watermarks-remover.git
          git fetch upstream main
          BEFORE=$(git rev-parse HEAD)
          if git merge --no-edit upstream/main; then
            if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
              git push origin main
              echo "上游有新变动，已同步。"
            else
              echo "已是最新，无需同步。"
            fi
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open issue on merge conflict
        if: failure() && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list --state open --search "上游同步冲突 in:title" --json number --jq length)
          if [ "$COUNT" = "0" ]; then
            printf '自动同步 guillaumemeyer/watermarks-remover 时发生合并冲突，需要手动处理：\n\n```bash\ncd ~/watermarks-remover\ngit fetch upstream\ngit merge upstream/main   # 解决冲突后 git push origin main\n```\n' > body.md
            gh issue create --title "上游同步冲突：需要手动合并" --body-file body.md
          fi
